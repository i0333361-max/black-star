
name: Build Black Star RP APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'Black_Star_RP_cloud_build.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-31" "build-tools;31.0.0"

      - name: Extract and fix Android project
        shell: bash
        run: |
          set -e
          mkdir -p source
          unzip -q Black_Star_RP_cloud_build.zip -d source

          echo "=== Original Android SDK settings ==="
          grep -R -n -E 'compileSdk|compileSdkVersion|targetSdkVersion|targetSdk|minSdkVersion|minSdk' source \
            --include='build.gradle' \
            --include='build.gradle.kts' || true

          echo "=== Replace old MaskedEditText dependency ==="
          find source -type f \( -name '*.gradle' -o -name '*.gradle.kts' \) -print0 |
            xargs -0 -r sed -i \
            's#ru\.egslava:MaskedEditText:1\.0\.5#io.github.softmedtanzania:maskededittext:1.0.5#g'

          echo "=== Set compile SDK to 31 ==="
          find source -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print0 |
            xargs -0 -r sed -i \
            -e 's/compileSdkVersion[[:space:]]\+30/compileSdkVersion 31/g' \
            -e 's/compileSdk[[:space:]]\+30/compileSdk 31/g' \
            -e 's/compileSdkVersion[[:space:]]*=[[:space:]]*30/compileSdkVersion = 31/g' \
            -e 's/compileSdk[[:space:]]*=[[:space:]]*30/compileSdk = 31/g'

          echo "=== Check app compile SDK ==="
          APP_GRADLE=$(find source -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' | head -1)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app Gradle file not found"
            exit 1
          fi

          cat "$APP_GRADLE"

          if ! grep -E 'compileSdk(Version)?[[:space:]]*(=)?[[:space:]]*31' "$APP_GRADLE"; then
            echo "ERROR: compile SDK 31 was not confirmed in app Gradle file"
            exit 1
          fi

          echo "=== Local libraries ==="
          find source -type f \( -name '*.aar' -o -name '*.jar' \) -print

      - name: Set up Java 8 for legacy Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Build APK
        shell: bash
        run: |
          set -e
          GRADLEW=$(find source -name gradlew -type f | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found in archive"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          chmod +x gradlew

          cat > /tmp/add-maven-central.gradle <<'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          ./gradlew -I /tmp/add-maven-central.gradle assembleDebug --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Black-Star-RP-APK
          path: source/**/build/outputs/apk/**/*.apk
          if-no-files-found: warn
