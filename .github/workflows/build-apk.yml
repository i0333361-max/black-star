
name: Build Black Star RP APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'Black_Star_RP_cloud_build.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-30" "build-tools;30.0.1"

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -q Black_Star_RP_cloud_build.zip -d source

          echo "=== Original dependency ==="
          grep -R -n -i -E 'MaskedEditText|egslava' source \
            --include='*.gradle' \
            --include='*.gradle.kts' || true

          echo "=== Replace old dependency coordinates ==="
          find source -type f -name '*.gradle' -print0 |
            xargs -0 -r sed -i \
            's#ru\.egslava:MaskedEditText:1\.0\.5#io.github.softmedtanzania:maskededittext:1.0.5#g'

          find source -type f -name '*.gradle.kts' -print0 |
            xargs -0 -r sed -i \
            's#ru\.egslava:MaskedEditText:1\.0\.5#io.github.softmedtanzania:maskededittext:1.0.5#g'

          echo "=== Dependency after replacement ==="
          grep -R -n -i -E 'MaskedEditText|egslava|maskededittext' source \
            --include='*.gradle' \
            --include='*.gradle.kts' || true

          echo "=== Existing local libraries ==="
          find source -type f \( -name '*.aar' -o -name '*.jar' \) -print

      - name: Set up Java 8 for legacy Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Build APK
        run: |
          GRADLEW=$(find source -name gradlew -type f | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found in archive"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          chmod +x gradlew

          cat > /tmp/add-maven-central.gradle <<'EOF'
          allprojects {
              repositories {
                  mavenCentral()
              }
          }
          EOF

          ./gradlew -I /tmp/add-maven-central.gradle assembleDebug --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Black-Star-RP-APK
          path: source/**/build/outputs/apk/**/*.apk
          if-no-files-found: warn
