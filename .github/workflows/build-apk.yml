
name: Build Black Star RP APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'Black_Star_RP_cloud_build.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-30" "build-tools;30.0.1"

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -q Black_Star_RP_cloud_build.zip -d source

          echo "=== Gradle files ==="
          find source -type f \( \
            -name 'build.gradle' -o \
            -name 'build.gradle.kts' \
          \) -print

          echo "=== MaskedEditText references ==="
          grep -R -n "MaskedEditText" source \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            || true

      - name: Check dependency availability
        run: |
          curl -fIL \
            https://repo.maven.apache.org/maven2/io/github/softmedtanzania/maskededittext/1.0.5/maskededittext-1.0.5.pom

      - name: Set up Java 8 for legacy Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Build APK
        run: |
          GRADLEW=$(find source -name gradlew -type f | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found in archive"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Black-Star-RP-APK
          path: source/**/build/outputs/apk/**/*.apk
          if-no-files-found: warn
