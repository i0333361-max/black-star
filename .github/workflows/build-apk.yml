
name: Build Black Star RP APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'Black_Star_RP_cloud_build.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-30" "build-tools;30.0.1"

      - name: Set up Java 8 for legacy Gradle project
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -q Black_Star_RP_cloud_build.zip -d source
          echo "Extracted project files:"
          find source -maxdepth 3 -type f | head -80

      - name: Build APK
        run: |
          cd source
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Black-Star-RP-APK
          path: |
            source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
