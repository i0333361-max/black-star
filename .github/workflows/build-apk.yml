
name: Build Black Star RP APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          unzip -q Black_Star_RP_cloud_build.zip -d source
          find source -name gradlew -type f

      - name: Install Android SDK
        run: sdkmanager "platforms;android-30" "build-tools;30.0.1"

      - name: Build APK
        run: |
          cd source
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Black-Star-RP-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
